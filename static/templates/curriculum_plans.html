{{template "header" }}
<div id="app" style="width:100%;padding:20px;">
    <template>
        <el-container v-loading.fullscreen.lock="fullscreenLoading">
            <el-main class="mainMain">
                <h3>課程計畫管理</h3>
                <el-row :gutter="10" style="margin-bottom:15px;">
                    <el-col :span="4">
                        <el-input v-model="searchForm.school_year" placeholder="學年度" size="small"></el-input>
                    </el-col>
                    <el-col :span="4">
                        <el-select v-model="searchForm.plan_type" placeholder="計畫類型" size="small" clearable>
                            <el-option label="課程計畫" value="curriculum"></el-option>
                            <el-option label="專案計畫" value="special"></el-option>
                            <el-option label="實驗計畫" value="experiment"></el-option>
                        </el-select>
                    </el-col>
                    <el-col :span="4">
                        <el-select v-model="searchForm.status" placeholder="狀態" size="small" clearable>
                            <el-option label="草稿" value="draft"></el-option>
                            <el-option label="已送出" value="submitted"></el-option>
                            <el-option label="審查中" value="reviewing"></el-option>
                            <el-option label="已通過" value="approved"></el-option>
                            <el-option label="已退回" value="rejected"></el-option>
                        </el-select>
                    </el-col>
                    <el-col :span="4">
                        <el-button type="primary" size="small" @click="searchPlans">查詢</el-button>
                        <el-button type="success" size="small" @click="addPlan">新增計畫</el-button>
                    </el-col>
                </el-row>

                <el-table :data="planList" border style="width:100%">
                    <el-table-column prop="id" label="ID" width="60"></el-table-column>
                    <el-table-column prop="name" label="計畫名稱"></el-table-column>
                    <el-table-column prop="school_year" label="學年度" width="100"></el-table-column>
                    <el-table-column prop="semester" label="學期" width="80">
                        <template slot-scope="scope">
                            <span v-if="scope.row.semester==1">上學期</span>
                            <span v-else>下學期</span>
                        </template>
                    </el-table-column>
                    <el-table-column prop="plan_type" label="類型" width="100">
                        <template slot-scope="scope">
                            <el-tag v-if="scope.row.plan_type=='curriculum'" type="primary" size="small">課程計畫</el-tag>
                            <el-tag v-else-if="scope.row.plan_type=='special'" type="warning" size="small">專案計畫</el-tag>
                            <el-tag v-else type="info" size="small">實驗計畫</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column prop="status" label="狀態" width="100">
                        <template slot-scope="scope">
                            <el-tag v-if="scope.row.status=='draft'" type="info" size="small">草稿</el-tag>
                            <el-tag v-else-if="scope.row.status=='submitted'" type="warning" size="small">已送出</el-tag>
                            <el-tag v-else-if="scope.row.status=='approved'" type="success" size="small">已通過</el-tag>
                            <el-tag v-else-if="scope.row.status=='rejected'" type="danger" size="small">已退回</el-tag>
                            <el-tag v-else size="small"><{scope.row.status}></el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column prop="submit_deadline" label="填報截止" width="120"></el-table-column>
                    <el-table-column label="操作" width="200">
                        <template slot-scope="scope">
                            <el-button @click="editPlan(scope.row)" type="primary" size="mini">編輯</el-button>
                            <el-button @click="deletePlan(scope.row.id)" type="danger" size="mini">刪除</el-button>
                        </template>
                    </el-table-column>
                </el-table>

                <el-pagination
                    style="margin-top:15px;"
                    @current-change="handlePageChange"
                    :current-page="currentPage"
                    :page-size="pageSize"
                    layout="total, prev, pager, next"
                    :total="total">
                </el-pagination>
            </el-main>
        </el-container>

        <el-dialog :title="planForm.id?'編輯計畫':'新增計畫'" :visible.sync="planDialog" width="50%" top="5vh">
            <el-form ref="planForm" :model="planForm" label-width="120px">
                <el-form-item label="計畫名稱" required>
                    <el-input v-model="planForm.name"></el-input>
                </el-form-item>
                <el-form-item label="學年度" required>
                    <el-input v-model="planForm.school_year" placeholder="例: 114"></el-input>
                </el-form-item>
                <el-form-item label="學期">
                    <el-radio-group v-model="planForm.semester">
                        <el-radio :label="1">上學期</el-radio>
                        <el-radio :label="2">下學期</el-radio>
                    </el-radio-group>
                </el-form-item>
                <el-form-item label="計畫類型">
                    <el-select v-model="planForm.plan_type">
                        <el-option label="課程計畫" value="curriculum"></el-option>
                        <el-option label="專案計畫" value="special"></el-option>
                        <el-option label="實驗計畫" value="experiment"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="計畫說明">
                    <el-input type="textarea" v-model="planForm.description" :rows="4"></el-input>
                </el-form-item>
                <el-form-item label="填報截止日">
                    <el-date-picker v-model="planForm.submit_deadline" type="date" value-format="yyyy-MM-dd"></el-date-picker>
                </el-form-item>
                <el-form-item label="審查截止日">
                    <el-date-picker v-model="planForm.review_deadline" type="date" value-format="yyyy-MM-dd"></el-date-picker>
                </el-form-item>
            </el-form>
            <span slot="footer">
                <el-button @click="planDialog=false">取消</el-button>
                <el-button type="primary" @click="submitPlan">確定</el-button>
            </span>
        </el-dialog>
    </template>
</div>
<script>
var app = new Vue({
    el: '#app',
    delimiters:["<{","}>"],
    data: {
        fullscreenLoading: false,
        planList: [],
        total: 0,
        currentPage: 1,
        pageSize: 20,
        searchForm: { school_year: '', plan_type: '', status: '' },
        planDialog: false,
        planForm: { id: '', name: '', school_year: '', semester: 1, plan_type: 'curriculum', description: '', submit_deadline: '', review_deadline: '' }
    },
    methods: {
        sendAjax(url, method, params, callback) {
            let _this = this;
            $.ajax({
                type: method, url: url, data: params,
                headers: { "token": localStorage.getItem("token") },
                success: function(data) {
                    if (data.code != 200) {
                        _this.$message({ message: data.msg, type: 'error' });
                    } else {
                        callback(data);
                    }
                }
            });
        },
        searchPlans() {
            let _this = this;
            this.sendAjax("/curriculum/plans", "GET", {
                school_year: this.searchForm.school_year,
                plan_type: this.searchForm.plan_type,
                status: this.searchForm.status,
                page: this.currentPage, page_size: this.pageSize
            }, function(data) {
                _this.planList = data.result || [];
                _this.total = data.total || 0;
            });
        },
        handlePageChange(page) { this.currentPage = page; this.searchPlans(); },
        addPlan() {
            this.planForm = { id: '', name: '', school_year: '', semester: 1, plan_type: 'curriculum', description: '', submit_deadline: '', review_deadline: '' };
            this.planDialog = true;
        },
        editPlan(row) {
            this.planForm = Object.assign({}, row);
            this.planDialog = true;
        },
        submitPlan() {
            let _this = this;
            this.sendAjax("/curriculum/plan", "POST", this.planForm, function(data) {
                _this.planDialog = false;
                _this.$message({ message: data.msg, type: 'success' });
                _this.searchPlans();
            });
        },
        deletePlan(id) {
            let _this = this;
            this.$confirm('確定刪除此計畫？', '提示', { type: 'warning' }).then(function() {
                _this.sendAjax("/curriculum/plan?id=" + id, "DELETE", {}, function(data) {
                    _this.$message({ message: '刪除成功', type: 'success' });
                    _this.searchPlans();
                });
            });
        }
    },
    created: function() { this.searchPlans(); }
});
</script>
</body>
</html>

{{template "header" }}
<div id="app" style="width:100%;padding:20px;">
    <template>
        <el-container v-loading.fullscreen.lock="fullscreenLoading">
            <el-main class="mainMain">
                <h3>課程計畫統計</h3>
                <el-row :gutter="20" style="margin-bottom:20px;">
                    <el-col :span="6">
                        <el-card shadow="hover">
                            <div slot="header"><span>計畫總數</span></div>
                            <div style="font-size:36px;text-align:center;color:#409EFF;"><{stats.total_plans||0}></div>
                        </el-card>
                    </el-col>
                    <el-col :span="6">
                        <el-card shadow="hover">
                            <div slot="header"><span>學校總數</span></div>
                            <div style="font-size:36px;text-align:center;color:#67C23A;"><{stats.total_schools||0}></div>
                        </el-card>
                    </el-col>
                    <el-col :span="6">
                        <el-card shadow="hover">
                            <div slot="header"><span>縣市總數</span></div>
                            <div style="font-size:36px;text-align:center;color:#E6A23C;"><{stats.total_counties||0}></div>
                        </el-card>
                    </el-col>
                    <el-col :span="6">
                        <el-card shadow="hover">
                            <div slot="header"><span>填報總數</span></div>
                            <div style="font-size:36px;text-align:center;color:#F56C6C;"><{stats.total_submissions||0}></div>
                        </el-card>
                    </el-col>
                </el-row>

                <el-divider></el-divider>
                <h4>依計畫查看填報統計</h4>
                <el-row :gutter="10" style="margin-bottom:15px;">
                    <el-col :span="4">
                        <el-input v-model="planId" placeholder="計畫ID" size="small"></el-input>
                    </el-col>
                    <el-col :span="4">
                        <el-button type="primary" size="small" @click="loadPlanStats">查詢</el-button>
                    </el-col>
                </el-row>
                <el-row :gutter="20" v-if="planStats.plan_id">
                    <el-col :span="4">
                        <el-statistic title="草稿" :value="planStats.draft||0"></el-statistic>
                    </el-col>
                    <el-col :span="4">
                        <el-statistic title="已送出" :value="planStats.submitted||0"></el-statistic>
                    </el-col>
                    <el-col :span="4">
                        <el-statistic title="已通過" :value="planStats.approved||0"></el-statistic>
                    </el-col>
                    <el-col :span="4">
                        <el-statistic title="已退回" :value="planStats.rejected||0"></el-statistic>
                    </el-col>
                    <el-col :span="4">
                        <el-statistic title="退件修正" :value="planStats.returned||0"></el-statistic>
                    </el-col>
                    <el-col :span="4">
                        <el-statistic title="合計" :value="planStats.total_submissions||0"></el-statistic>
                    </el-col>
                </el-row>
            </el-main>
        </el-container>
    </template>
</div>
<script>
var app = new Vue({
    el: '#app',
    delimiters:["<{","}>"],
    data: {
        fullscreenLoading: false,
        stats: {},
        planId: '',
        planStats: {}
    },
    methods: {
        sendAjax(url, method, params, callback) {
            let _this = this;
            $.ajax({ type: method, url: url, data: params, headers: { "token": localStorage.getItem("token") },
                success: function(data) { if (data.code != 200) { _this.$message({ message: data.msg, type: 'error' }); } else { callback(data); } }
            });
        },
        loadStats() {
            let _this = this;
            this.sendAjax("/curriculum/statistics", "GET", {}, function(data) { _this.stats = data.result || {}; });
        },
        loadPlanStats() {
            let _this = this;
            if (!this.planId) return;
            this.sendAjax("/curriculum/statistics", "GET", { plan_id: this.planId }, function(data) { _this.planStats = data.result || {}; });
        }
    },
    created: function() { this.loadStats(); }
});
</script>
</body>
</html>
